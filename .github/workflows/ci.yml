name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: mypy
      # The sandbox needs root (to unshare namespaces and drop to an unprivileged uid); the runner has sudo.
      - run: sudo -E env "PATH=$PATH" python -m pytest
